# PEP 518: https://www.python.org/dev/peps/pep-0518/
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100

[tool.isort]
force_single_line = true
known_first_party = "idpysdjwt"
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 100

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[project]
authors = [
    {name = "Roland Hedberg", email = "roland@catalogix.se"},
]
license = {text = "Apache-2.0"}
requires-python = "<4.0,>=3.8"
dependencies = [
    "cryptography>=38.0.3",
    "cryptojwt>=1.9.1",
    "idpyoidc>=5.0.0",
]
name = "idpysdjwt"
version = "0.0.1"
description = "Python implementation of Selective Disclosure JWT"
readme = "README.md"

[project.urls]
repository = "https://github.com/SUNET/idpy-sdjwt"

[dependency-groups]
dev = [
    "alabaster<1.0.0,>=0.7.12",
    "black<23,>=22",
    "isort<6.0.0,>=5.6.4",
    "pytest<7.0.0,>=6.1.2",
    "pytest-black<1.0.0,>=0.3.12",
    "pytest-isort<2.0.0,>=1.2.0",
    "pytest-cov<5.0.0,>=4.0.0",
    "responses<1.0.0,>=0.22.0",
    "sphinx<4.0.0,>=3.5.2",
    "sphinx-autobuild<2022.0.0,>=2021.3.14",
    "coverage<8,>=7",
]
